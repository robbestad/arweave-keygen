[package]
name = "arweave-keygen"
version = "0.1.0"
edition = "2021"
description = "Generate an Arweave RSA-4096 JWK wallet locally"
license = "MIT"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# RSA-4096 keygen is painfully slow without optimizations.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.test.package.num-bigint-dig]
opt-level = 3
